      min-height:100vh;margin:0;padding:16px;text-align:center;}
    .card{max-width:420px;background:#fff;border:1px solid #eee;border-radius:18px;

  <meta http-equiv="refresh" content="3;url=https://liaohao.cc/dictation/">
